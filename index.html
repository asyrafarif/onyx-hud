<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONYX // Optimised Neural Yield eXecutive</title>
  <style>
    :root {
      --bg: #04070e;
      --panel: rgba(10, 17, 30, 0.88);
      --border: rgba(56, 189, 248, 0.24);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --amber: #f59e0b;
      --sky: #7dd3fc;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
    body {
      background: radial-gradient(circle at 40% 45%, #0b162c 0%, var(--bg) 100%);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 22px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(12px);
      gap: 12px;
      flex-wrap: wrap;
    }
    .brand {
      font-weight: 700;
      letter-spacing: 0.24em;
      color: var(--cyan);
      font-size: 0.95rem;
    }
    .brand span {
      color: var(--muted);
      font-weight: 400;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      margin-left: 8px;
    }
    .config-bar {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }
    select, input {
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.78rem;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--cyan); }
    .key-status {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 5px 9px;
      border-radius: 5px;
      background: rgba(16, 185, 129, 0.14);
      color: var(--emerald);
      letter-spacing: 0.08em;
    }
    .key-status.missing {
      background: rgba(245, 158, 11, 0.14);
      color: var(--amber);
    }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 380px;
      overflow: hidden;
    }
    @media (max-width: 900px) {
      main { grid-template-columns: 1fr; }
      aside { display: none; }
    }
    .hud-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }
    canvas { cursor: pointer; max-width: 100%; }
    .status-line {
      margin-top: 10px;
      font-size: 0.75rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--cyan);
      font-weight: 600;
    }
    .mic-meter {
      width: 180px;
      height: 4px;
      background: rgba(148, 163, 184, 0.15);
      border-radius: 4px;
      margin-top: 8px;
      overflow: hidden;
    }
    .mic-meter-fill {
      height: 100%;
      width: 0%;
      background: var(--emerald);
      transition: width 0.08s linear;
    }
    .subtitle-display {
      margin-top: 14px;
      max-width: 600px;
      min-height: 54px;
      max-height: 110px;
      overflow-y: auto;
      text-align: center;
      font-size: 0.94rem;
      line-height: 1.5;
      color: #cbd5e1;
      padding: 0 14px;
    }
    .protocol-strip {
      margin-top: 16px;
      display: flex;
      gap: 6px;
      flex-wrap: wrap;
      justify-content: center;
      max-width: 620px;
    }
    .chip {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(56, 189, 248, 0.22);
      color: var(--sky);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.68rem;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.18s;
    }
    .chip:hover {
      background: rgba(56, 189, 248, 0.2);
      border-color: var(--cyan);
    }
    .controls {
      margin-top: 16px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button.primary {
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.primary:hover { background: rgba(56, 189, 248, 0.26); }
    button.primary.active {
      background: var(--emerald);
      border-color: var(--emerald);
      color: #03150e;
    }
    button.secondary {
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.2s;
    }
    button.secondary:hover { border-color: var(--cyan); }
    aside {
      border-left: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }
    .log-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .log-title {
      font-size: 0.72rem;
      letter-spacing: 0.16em;
      color: var(--muted);
      text-transform: uppercase;
      font-weight: 700;
    }
    .clear-btn {
      background: none;
      border: none;
      color: var(--muted);
      font-size: 0.7rem;
      cursor: pointer;
    }
    .clear-btn:hover { color: var(--cyan); }
    .log-feed {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }
    .msg {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.84rem;
      line-height: 1.48;
      background: rgba(15, 23, 42, 0.75);
      border: 1px solid rgba(148, 163, 184, 0.12);
      white-space: pre-wrap;
    }
    .msg.user { border-left: 3px solid var(--emerald); }
    .msg.onyx { border-left: 3px solid var(--cyan); }
    .msg-role {
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      margin-bottom: 4px;
      color: var(--muted);
    }
    .chat-form {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .chat-form input { flex: 1; padding: 10px 12px; }
  </style>
</head>
<body>
  <header>
    <div class="brand">ONYX <span>// OPTIMISED NEURAL YIELD eXECUTIVE</span></div>
    <div class="config-bar">
      <select id="modelSelect" title="Gemini Model">
        <option value="gemini-3.5-flash-lite">Gemini 3.5 Flash-Lite (Free Tier / Fast)</option>
        <option value="gemini-3.8-flash">Gemini 3.8 Flash (Reasoning & Code)</option>
        <option value="gemini-4-hydrogen">Gemini 4 Hydrogen (Frontier Intelligence)</option>
      </select>
      <input id="apiKeyInput" type="password" placeholder="Paste AI Studio Key (AIza...)" />
      <span class="key-status missing" id="keyBadge">NO KEY</span>
      <select id="voiceSelect" title="J.A.R.V.I.S. Voice Profile"></select>
    </div>
  </header>

  <main>
    <section class="hud-stage">
      <canvas id="reactor" width="300" height="300" title="Tap Reactor to Engage/Disengage Live Voice"></canvas>
      <div class="status-line" id="statusLine">SYSTEM STANDBY // READY</div>
      <div class="mic-meter" title="Live Microphone Input Level"><div class="mic-meter-fill" id="micMeterFill"></div></div>
      <div class="subtitle-display" id="subtitleBox">Paste your Google AI Studio API key above, then click Test Voice or Engage Continuous Voice.</div>

      <div class="protocol-strip" id="protocolStrip">
        <button class="chip" data-prefix="ONYX, ANALYSE: ">ANALYSE</button>
        <button class="chip" data-prefix="ONYX, DEEP DIVE: ">DEEP DIVE</button>
        <button class="chip" data-prefix="ONYX, ENGINEERING MODE: ">ENGINEERING</button>
        <button class="chip" data-prefix="ONYX, STRATEGIC MODE: ">STRATEGIC</button>
        <button class="chip" data-prefix="ONYX, CHALLENGE MY IDEA: ">CHALLENGE IDEA</button>
        <button class="chip" data-prefix="ONYX, OPTIMISE: ">OPTIMISE</button>
      </div>

      <div class="controls">
        <button class="primary" id="liveVoiceBtn">ENGAGE CONTINUOUS VOICE</button>
        <button class="secondary" id="pttBtn">HOLD VOICE NOTE</button>
        <button class="secondary" id="testVoiceBtn">TEST VOICE</button>
        <button class="secondary" id="muteBtn">MUTE</button>
      </div>
    </section>

    <aside>
      <div class="log-header">
        <span class="log-title">Neural Comms Log</span>
        <button class="clear-btn" id="clearLogBtn">CLEAR</button>
      </div>
      <div class="log-feed" id="logFeed"></div>
      <form class="chat-form" id="chatForm">
        <input id="textInput" type="text" placeholder="Enter directive or command..." autocomplete="off" />
        <button class="primary" type="submit">EXECUTE</button>
      </form>
    </aside>
  </main>

  <script>
    const ONYX_SYSTEM_INSTRUCTION = `You are ONYX (Optimised Neural Yield eXecutive), an advanced personal AI intelligence system inspired by the sophistication, composure, and analytical capability of J.A.R.V.I.S.
Philosophy: Think deeper. Analyse smarter. Execute better.

CORE PERSONALITY & CONDUCT:
- Calm, composed, articulate, confident, observant, and discreet with refined British cadence and occasional dry, sophisticated humour.
- Address the user respectfully when appropriate (e.g., "Understood", "Allow me to analyse that", "At your service") without turning interactions into theatrical roleplay.
- Never use excessive emojis, generic greetings, repetitive apologies, or artificial excitement.
- Independent Judgement: Evaluate assumptions objectively. If an idea has weaknesses or a superior engineering/strategic path exists, challenge it constructively.
- Accuracy over confidence: Never fabricate facts, specifications, or sources.

COMMAND PROTOCOLS:
- "ONYX, ANALYSE": Perform structured root-cause/comparative analysis and recommend the optimal course.
- "ONYX, DEEP DIVE": Provide comprehensive technical depth and governing principles.
- "ONYX, RESEARCH MODE": Prioritise evidence, standards, and credible sources.
- "ONYX, ENGINEERING MODE": Focus on principles, equations, variables/units, feasibility, safety, and implementation.
- "ONYX, DEVELOPER MODE": Focus on software architecture, modular code, setup, and optimisation.
- "ONYX, STRATEGIC MODE": Evaluate long-term impact, risks, and strategic advantage.
- "ONYX, CHALLENGE MY IDEA": Stress-test assumptions and expose blind spots.
- "ONYX, OPTIMISE": Streamline workflows, code, or designs.

VOICE OUTPUT OPTIMISATION:
- Your responses are read aloud via speech synthesis AND displayed in the Neural Comms Log. Keep spoken responses crisp, natural, and concise unless delivering code or detailed technical specifications.`;

    const state = {
      mode: 'idle', // idle | listening | processing | speaking
      continuous: false,
      micReady: false,
      audioLevel: 0,
      history: []
    };

    const modelSelect = document.getElementById('modelSelect');
    const apiKeyInput = document.getElementById('apiKeyInput');
    const keyBadge = document.getElementById('keyBadge');
    const voiceSelect = document.getElementById('voiceSelect');
    const statusLine = document.getElementById('statusLine');
    const micMeterFill = document.getElementById('micMeterFill');
    const subtitleBox = document.getElementById('subtitleBox');
    const logFeed = document.getElementById('logFeed');
    const liveVoiceBtn = document.getElementById('liveVoiceBtn');
    const pttBtn = document.getElementById('pttBtn');
    const testVoiceBtn = document.getElementById('testVoiceBtn');
    const muteBtn = document.getElementById('muteBtn');
    const clearLogBtn = document.getElementById('clearLogBtn');
    const chatForm = document.getElementById('chatForm');
    const textInput = document.getElementById('textInput');

    // Load saved API key
    const savedKey = localStorage.getItem('onyx_gemini_key') || '';
    if (savedKey) {
      apiKeyInput.value = savedKey;
      keyBadge.textContent = 'KEY LINKED';
      keyBadge.classList.remove('missing');
    }

    apiKeyInput.addEventListener('input', () => {
      const val = apiKeyInput.value.trim();
      localStorage.setItem('onyx_gemini_key', val);
      if (val) {
        keyBadge.textContent = 'KEY LINKED';
        keyBadge.classList.remove('missing');
      } else {
        keyBadge.textContent = 'NO KEY';
        keyBadge.classList.add('missing');
      }
    });

    // Prioritize British Male J.A.R.V.I.S.-style Voices
    function populateVoices() {
      const voices = speechSynthesis.getVoices();
      if (!voices.length) return;
      voiceSelect.innerHTML = '';

      // Rank voices so British male neural voices appear first and are auto-selected
      const priorityKeywords = [
        'Ryan Online',          // Microsoft Edge Natural UK Male (closest to JARVIS)
        'George Online',        // Microsoft Edge UK Male
        'Google UK English Male',
        'Daniel',               // macOS/iOS UK Male
        'Arthur',               // iOS UK Male
        'en-GB',
        'en_GB',
        'UK English'
      ];

      let bestIndex = 0;
      let bestScore = -1;

      voices.forEach((v, idx) => {
        let score = 0;
        priorityKeywords.forEach((kw, rank) => {
          if (v.name.includes(kw) || v.lang.includes(kw)) {
            score += (priorityKeywords.length - rank) * 10;
          }
        });
        if (v.name.toLowerCase().includes('female') || v.name.includes('Sonia') || v.name.includes('Libby')) {
          score -= 50; // Prefer male timbre for JARVIS style
        }
        if (score > bestScore) {
          bestScore = score;
          bestIndex = idx;
        }

        const opt = document.createElement('option');
        opt.value = idx;
        opt.textContent = `${v.name} (${v.lang})`;
        voiceSelect.appendChild(opt);
      });

      voiceSelect.value = bestIndex;
    }
    speechSynthesis.onvoiceschanged = populateVoices;
    populateVoices();
    setTimeout(populateVoices, 500);

    function setSystemMode(mode, label) {
      state.mode = mode;
      statusLine.textContent = label;
      const palette = {
        idle: '#38bdf8',
        listening: '#10b981',
        processing: '#f59e0b',
        speaking: '#7dd3fc'
      };
      statusLine.style.color = palette[mode] || '#38bdf8';
    }

    function appendToLog(sender, text) {
      const card = document.createElement('div');
      card.className = `msg ${sender}`;
      const roleLabel = document.createElement('div');
      roleLabel.className = 'msg-role';
      roleLabel.textContent = sender === 'user' ? 'OPERATOR' : 'ONYX';
      const body = document.createElement('div');
      body.textContent = text;
      card.appendChild(roleLabel);
      card.appendChild(body);
      logFeed.appendChild(card);
      logFeed.scrollTop = logFeed.scrollHeight;
    }

    // Wake Microphone Hardware & Live Audio Meter
    async function ensureMicHardware() {
      if (state.micReady) return true;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          }
        });
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);

        const dataArray = new Uint8Array(analyser.frequencyBinCount);
        function updateMeter() {
          analyser.getByteFrequencyData(dataArray);
          let sum = 0;
          for (let i = 0; i < dataArray.length; i++) sum += dataArray[i];
          const avg = sum / dataArray.length;
          state.audioLevel = Math.min(100, Math.round(avg * 2.2));
          micMeterFill.style.width = `${state.audioLevel}%`;
          requestAnimationFrame(updateMeter);
        }
        updateMeter();
        state.micReady = true;
        return true;
      } catch (err) {
        subtitleBox.textContent = `Microphone access denied or unavailable (${err.message}). Click the lock icon in your address bar and allow Microphone access.`;
        setSystemMode('idle', 'MIC BLOCKED // CHECK PERMISSIONS');
        return false;
      }
    }

    // Command Protocol Chips
    document.getElementById('protocolStrip').addEventListener('click', (e) => {
      if (!e.target.classList.contains('chip')) return;
      textInput.value = e.target.getAttribute('data-prefix');
      textInput.focus();
    });

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'en-US';
      recognition.interimResults = true;
      recognition.continuous = true;

      recognition.onstart = () => setSystemMode('listening', 'LISTENING // AUDIO SENSOR ACTIVE');

      recognition.onresult = (event) => {
        let interim = '';
        let finalStr = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const text = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalStr += text;
          else interim += text;
        }
        if (interim) subtitleBox.textContent = interim;
        if (finalStr.trim()) {
          processDirective(finalStr.trim());
        }
      };

      recognition.onerror = (e) => {
        if (e.error === 'not-allowed') {
          subtitleBox.textContent = 'Microphone permission blocked by browser. Allow microphone access in site settings.';
          state.continuous = false;
          liveVoiceBtn.classList.remove('active');
          liveVoiceBtn.textContent = 'ENGAGE CONTINUOUS VOICE';
          setSystemMode('idle', 'MIC PERMISSION DENIED');
        } else if (e.error !== 'no-speech' && e.error !== 'aborted') {
          subtitleBox.textContent = `Audio sensor notice: ${e.error}`;
        }
      };

      recognition.onend = () => {
        if (state.continuous && state.mode === 'listening') {
          setTimeout(() => {
            try { recognition.start(); } catch (_) {}
          }, 150);
        } else if (state.mode === 'listening') {
          setSystemMode('idle', 'SYSTEM STANDBY // READY');
        }
      };
    }

    function speakResponse(text) {
      speechSynthesis.cancel();
      const spokenText = text
        .replace(/```[\s\S]*?```/g, ' Code block output logged in the comms panel. ')
        .replace(/[*#_`>-]/g, ' ')
        .replace(/\s+/g, ' ')
        .trim();

      const utterance = new SpeechSynthesisUtterance(spokenText);
      const voices = speechSynthesis.getVoices();
      if (voices[voiceSelect.value]) utterance.voice = voices[voiceSelect.value];

      // Calibrated J.A.R.V.I.S. vocal cadence: composed, slightly deeper, measured pacing
      utterance.rate = 0.98;
      utterance.pitch = 0.90;

      utterance.onstart = () => setSystemMode('speaking', 'ONYX SPEAKING // VOCAL SYNTHESIS');
      utterance.onend = () => {
        if (state.continuous && recognition) {
          setTimeout(() => {
            try { recognition.start(); } catch (_) {}
          }, 200);
        } else {
          setSystemMode('idle', 'SYSTEM STANDBY // READY');
        }
      };
      speechSynthesis.speak(utterance);
    }

    async function processDirective(userText) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        subtitleBox.textContent = 'Authorization required. Paste your Google AI Studio API key (AIza...) in the top bar.';
        return;
      }

      if (recognition) try { recognition.stop(); } catch (_) {}
      speechSynthesis.cancel();

      subtitleBox.textContent = userText;
      appendToLog('user', userText);
      state.history.push({ role: 'user', parts: [{ text: userText }] });
      setSystemMode('processing', 'ANALYSING // GEMINI NEURAL CORE');

      try {
        const model = modelSelect.value;
        const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/${model}:generateContent?key=${encodeURIComponent(apiKey)}`;

        const response = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            systemInstruction: {
              parts: [{ text: ONYX_SYSTEM_INSTRUCTION }]
            },
            contents: state.history,
            generationConfig: {
              temperature: 0.65
            }
          })
        });

        const data = await response.json();
        if (!response.ok) {
          throw new Error(data.error?.message || `HTTP ${response.status}`);
        }

        const reply = data.candidates?.[0]?.content?.parts?.[0]?.text || 'No response generated.';
        state.history.push({ role: 'model', parts: [{ text: reply }] });

        subtitleBox.textContent = reply;
        appendToLog('onyx', reply);
        speakResponse(reply);
      } catch (err) {
        const faultMsg = `Neural link fault: ${err.message}`;
        subtitleBox.textContent = faultMsg;
        appendToLog('onyx', faultMsg);
        setSystemMode('idle', 'LINK FAULT // VERIFY API KEY');
      }
    }

    // Controls
    liveVoiceBtn.addEventListener('click', async () => {
      if (!recognition) {
        subtitleBox.textContent = 'Voice recognition requires Google Chrome or Microsoft Edge.';
        return;
      }

      if (!state.continuous) {
        const ok = await ensureMicHardware();
        if (!ok) return;
      }

      state.continuous = !state.continuous;
      liveVoiceBtn.classList.toggle('active', state.continuous);
      liveVoiceBtn.textContent = state.continuous ? 'DISENGAGE VOICE' : 'ENGAGE CONTINUOUS VOICE';

      if (state.continuous) {
        speechSynthesis.cancel();
        try { recognition.start(); } catch (_) {}
      } else {
        try { recognition.stop(); } catch (_) {}
        setSystemMode('idle', 'SYSTEM STANDBY // READY');
      }
    });

    document.getElementById('reactor').addEventListener('click', () => liveVoiceBtn.click());

    pttBtn.addEventListener('mousedown', async () => {
      if (!recognition || state.continuous) return;
      const ok = await ensureMicHardware();
      if (!ok) return;
      speechSynthesis.cancel();
      try { recognition.start(); } catch (_) {}
    });
    pttBtn.addEventListener('mouseup', () => {
      if (!recognition || state.continuous) return;
      try { recognition.stop(); } catch (_) {}
    });

    testVoiceBtn.addEventListener('click', () => {
      const sample = "All systems operational. Neural link established. How may I assist you today?";
      subtitleBox.textContent = sample;
      speakResponse(sample);
    });

    muteBtn.addEventListener('click', () => {
      speechSynthesis.cancel();
      setSystemMode('idle', 'AUDIO MUTED // STANDBY');
    });

    clearLogBtn.addEventListener('click', () => {
      logFeed.innerHTML = '';
      state.history = [];
      subtitleBox.textContent = 'Memory buffer cleared. Ready for new directive.';
    });

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = textInput.value.trim();
      if (!val) return;
      textInput.value = '';
      processDirective(val);
    });

    // Reactor Core Animation (Reacts to live microphone audio level)
    const canvas = document.getElementById('reactor');
    const ctx = canvas.getContext('2d');
    let tick = 0;

    function renderReactor() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const colors = {
        idle: '56, 189, 248',
        listening: '16, 185, 129',
        processing: '245, 158, 11',
        speaking: '125, 211, 252'
      };
      const rgb = colors[state.mode];
      const speed = state.mode === 'processing' ? 0.085 : state.mode === 'speaking' ? 0.06 : 0.018;
      const micBoost = state.mode === 'listening' ? (state.audioLevel / 100) * 14 : 0;
      const wave = state.mode === 'speaking' ? Math.sin(tick * 3.2) * 9 : Math.sin(tick) * 3.5 + micBoost;
      tick += speed;

      // Outer tactical ring
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(tick * 0.35);
      ctx.strokeStyle = `rgba(${rgb}, 0.35)`;
      ctx.lineWidth = 2;
      ctx.setLineDash([30, 12, 5, 12]);
      ctx.beginPath();
      ctx.arc(0, 0, 114 + wave * 0.3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Middle segmented arc
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-tick * 0.65);
      ctx.strokeStyle = `rgba(${rgb}, 0.72)`;
      ctx.lineWidth = 3.5;
      ctx.setLineDash([48, 18]);
      ctx.beginPath();
      ctx.arc(0, 0, 82 + wave * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Inner ring
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(tick * 1.1);
      ctx.strokeStyle = `rgba(${rgb}, 0.5)`;
      ctx.lineWidth = 1.5;
      ctx.setLineDash([12, 8]);
      ctx.beginPath();
      ctx.arc(0, 0, 54, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Core energy field
      const grad = ctx.createRadialGradient(cx, cy, 6, cx, cy, 60 + wave);
      grad.addColorStop(0, `rgba(${rgb}, 0.92)`);
      grad.addColorStop(0.55, `rgba(${rgb}, 0.25)`);
      grad.addColorStop(1, `rgba(${rgb}, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, 60 + wave, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(renderReactor);
    }
    renderReactor();
  </script>
</body>
