<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONYX // Zero-Cost Tactical HUD</title>
  <style>
    :root {
      --bg: #05080f;
      --panel: rgba(10, 18, 32, 0.85);
      --border: rgba(56, 189, 248, 0.25);
      --cyan: #38bdf8;
      --emerald: #10b981;
      --amber: #f59e0b;
      --text: #e2e8f0;
      --muted: #64748b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: radial-gradient(circle at center, #0b1324 0%, var(--bg) 100%);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
      backdrop-filter: blur(10px);
    }
    .brand { font-weight: 700; letter-spacing: 0.2em; color: var(--cyan); font-size: 0.95rem; }
    .brand span { color: var(--muted); font-weight: 400; font-size: 0.75rem; margin-left: 8px; }
    .config-bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    select, input {
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
      outline: none;
    }
    select:focus, input:focus { border-color: var(--cyan); }
    main {
      flex: 1;
      display: grid;
      grid-template-columns: 1fr 340px;
      overflow: hidden;
    }
    @media (max-width: 820px) {
      main { grid-template-columns: 1fr; }
      aside { display: none; }
    }
    .core-stage {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 20px;
    }
    canvas { cursor: pointer; max-width: 100%; }
    .status-badge {
      margin-top: 12px;
      font-size: 0.75rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--cyan);
    }
    .subtitle-box {
      margin-top: 16px;
      max-width: 560px;
      min-height: 48px;
      text-align: center;
      font-size: 0.95rem;
      line-height: 1.5;
      color: #cbd5e1;
      padding: 0 16px;
    }
    .controls {
      margin-top: 24px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid var(--cyan);
      color: var(--cyan);
      padding: 10px 18px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      cursor: pointer;
      transition: all 0.2s;
    }
    button:hover { background: rgba(56, 189, 248, 0.25); }
    button.active { background: var(--emerald); border-color: var(--emerald); color: #04130d; }
    button.secondary { border-color: var(--border); color: var(--text); background: rgba(15, 23, 42, 0.6); }
    aside {
      border-left: 1px solid var(--border);
      background: var(--panel);
      display: flex;
      flex-direction: column;
      padding: 16px;
      overflow: hidden;
    }
    .log-title {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      color: var(--muted);
      margin-bottom: 12px;
      text-transform: uppercase;
    }
    .log-feed {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding-right: 4px;
    }
    .msg {
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.85rem;
      line-height: 1.45;
      background: rgba(15, 23, 42, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.12);
    }
    .msg.user { border-left: 3px solid var(--emerald); }
    .msg.onyx { border-left: 3px solid var(--cyan); }
    .msg-role { font-size: 0.7rem; font-weight: 700; letter-spacing: 0.1em; margin-bottom: 4px; color: var(--muted); }
    .text-input-row {
      display: flex;
      gap: 8px;
      margin-top: 12px;
    }
    .text-input-row input { flex: 1; }
  </style>
</head>
<body>
  <header>
    <div class="brand">ONYX <span>// ZERO-COST NEURAL INTERFACE</span></div>
    <div class="config-bar">
      <select id="provider">
        <option value="ollama">Local Ollama (100% Free / Offline)</option>
        <option value="groq">Groq Free Tier (Cloud)</option>
        <option value="openrouter">OpenRouter Free Tier (Cloud)</option>
      </select>
      <input id="modelName" type="text" value="llama3.2" placeholder="Model (e.g. llama3.2)" title="Model ID" />
      <input id="apiKey" type="password" placeholder="API Key (Not needed for Ollama)" style="display:none;" />
      <select id="voiceSelect" title="Browser Voice"></select>
    </div>
  </header>

  <main>
    <section class="core-stage">
      <canvas id="reactor" width="320" height="320" title="Click to toggle continuous voice"></canvas>
      <div class="status-badge" id="statusText">SYSTEM IDLE // READY</div>
      <div class="subtitle-box" id="subtitle">Select a provider above, then engage continuous voice or hold Push-to-Talk.</div>
      <div class="controls">
        <button id="toggleLiveBtn">ENGAGE CONTINUOUS VOICE</button>
        <button id="pttBtn" class="secondary">HOLD VOICE NOTE</button>
        <button id="stopSpeechBtn" class="secondary">MUTE AUDIO</button>
      </div>
    </section>

    <aside>
      <div class="log-title">Neural Comms Log</div>
      <div class="log-feed" id="logFeed"></div>
      <form class="text-input-row" id="textForm">
        <input id="textInput" type="text" placeholder="Enter command..." autocomplete="off" />
        <button type="submit">SEND</button>
      </form>
    </aside>
  </main>

  <script>
    const SYSTEM_PROMPT = `You are ONYX (Optimised Neural Yield eXecutive), a calm, intelligent, composed AI operating partner inspired by J.A.R.V.I.S. Keep spoken responses concise, clear, and natural for voice synthesis—avoid markdown symbols, bullet asterisks, or code blocks unless explicitly requested.`;

    const state = {
      mode: 'idle', // idle | listening | processing | speaking
      continuous: false,
      history: [{ role: 'system', content: SYSTEM_PROMPT }]
    };

    const providerEl = document.getElementById('provider');
    const modelEl = document.getElementById('modelName');
    const apiKeyEl = document.getElementById('apiKey');
    const voiceSelectEl = document.getElementById('voiceSelect');
    const statusEl = document.getElementById('statusText');
    const subtitleEl = document.getElementById('subtitle');
    const logFeedEl = document.getElementById('logFeed');
    const toggleLiveBtn = document.getElementById('toggleLiveBtn');
    const pttBtn = document.getElementById('pttBtn');
    const stopSpeechBtn = document.getElementById('stopSpeechBtn');
    const textForm = document.getElementById('textForm');
    const textInput = document.getElementById('textInput');

    // Provider defaults
    providerEl.addEventListener('change', () => {
      const p = providerEl.value;
      if (p === 'ollama') {
        apiKeyEl.style.display = 'none';
        modelEl.value = 'llama3.2';
      } else if (p === 'groq') {
        apiKeyEl.style.display = 'inline-block';
        modelEl.value = 'llama-3.3-70b-versatile';
      } else if (p === 'openrouter') {
        apiKeyEl.style.display = 'inline-block';
        modelEl.value = 'meta-llama/llama-3.3-70b-instruct:free';
      }
    });

    // Populate Browser Voices
    function loadVoices() {
      const voices = speechSynthesis.getVoices();
      voiceSelectEl.innerHTML = '';
      voices.forEach((v, i) => {
        const opt = document.createElement('option');
        opt.value = i;
        opt.textContent = `${v.name} (${v.lang})`;
        if (v.name.includes('UK English Male') || v.name.includes('Daniel') || v.name.includes('Google UK English Male')) {
          opt.selected = true;
        }
        voiceSelectEl.appendChild(opt);
      });
    }
    speechSynthesis.onvoiceschanged = loadVoices;
    loadVoices();

    function setMode(newMode, label) {
      state.mode = newMode;
      statusEl.textContent = label;
      const colors = { idle: '#38bdf8', listening: '#10b981', processing: '#f59e0b', speaking: '#7dd3fc' };
      statusEl.style.color = colors[newMode] || '#38bdf8';
    }

    function appendLog(role, text) {
      const div = document.createElement('div');
      div.className = `msg ${role}`;
      div.innerHTML = `<div class="msg-role">${role === 'user' ? 'OPERATOR' : 'ONYX'}</div><div>${text}</div>`;
      logFeedEl.appendChild(div);
      logFeedEl.scrollTop = logFeedEl.scrollHeight;
    }

    // Speech Recognition Setup
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      recognition.interimResults = true;
      recognition.continuous = false;

      recognition.onstart = () => setMode('listening', 'LISTENING // AUDIO INPUT ACTIVE');

      recognition.onresult = (event) => {
        let interim = '';
        let finalTranscript = '';
        for (let i = event.resultIndex; i < event.results.length; i++) {
          const transcript = event.results[i][0].transcript;
          if (event.results[i].isFinal) finalTranscript += transcript;
          else interim += transcript;
        }
        if (interim) subtitleEl.textContent = interim;
        if (finalTranscript.trim()) {
          handleUserMessage(finalTranscript.trim());
        }
      };

      recognition.onerror = (e) => {
        if (e.error !== 'no-speech' && e.error !== 'aborted') {
          subtitleEl.textContent = `Mic error: ${e.error}`;
        }
        if (state.mode === 'listening') setMode('idle', 'SYSTEM IDLE // READY');
      };

      recognition.onend = () => {
        if (state.continuous && state.mode === 'listening') {
          try { recognition.start(); } catch (_) {}
        } else if (state.mode === 'listening') {
          setMode('idle', 'SYSTEM IDLE // READY');
        }
      };
    } else {
      subtitleEl.textContent = 'Web Speech Recognition is not supported in this browser. Use Chrome or Edge, or use the text input.';
    }

    function speak(text) {
      speechSynthesis.cancel();
      const cleanText = text.replace(/[*#_`]/g, '');
      const utterance = new SpeechSynthesisUtterance(cleanText);
      const voices = speechSynthesis.getVoices();
      if (voices[voiceSelectEl.value]) utterance.voice = voices[voiceSelectEl.value];
      utterance.rate = 1.02;
      utterance.pitch = 0.95;

      utterance.onstart = () => setMode('speaking', 'ONYX SPEAKING // SYNTHESIS ACTIVE');
      utterance.onend = () => {
        if (state.continuous && recognition) {
          try { recognition.start(); } catch (_) {}
        } else {
          setMode('idle', 'SYSTEM IDLE // READY');
        }
      };
      speechSynthesis.speak(utterance);
    }

    async function handleUserMessage(text) {
      if (recognition) try { recognition.stop(); } catch (_) {}
      speechSynthesis.cancel();

      subtitleEl.textContent = text;
      appendLog('user', text);
      state.history.push({ role: 'user', content: text });
      setMode('processing', 'ANALYSING // NEURAL COMPUTATION');

      try {
        const reply = await queryLLM(state.history);
        state.history.push({ role: 'assistant', content: reply });
        subtitleEl.textContent = reply;
        appendLog('onyx', reply);
        speak(reply);
      } catch (err) {
        const errMsg = `Connection fault: ${err.message}`;
        subtitleEl.textContent = errMsg;
        appendLog('onyx', errMsg);
        setMode('idle', 'FAULT // CHECK PROVIDER CONFIG');
      }
    }

    async function queryLLM(messages) {
      const provider = providerEl.value;
      const model = modelEl.value.trim();
      const apiKey = apiKeyEl.value.trim();

      let url = 'http://localhost:11434/v1/chat/completions';
      const headers = { 'Content-Type': 'application/json' };

      if (provider === 'groq') {
        if (!apiKey) throw new Error('Groq API key required.');
        url = 'https://api.groq.com/openai/v1/chat/completions';
        headers['Authorization'] = `Bearer ${apiKey}`;
      } else if (provider === 'openrouter') {
        if (!apiKey) throw new Error('OpenRouter API key required.');
        url = 'https://openrouter.ai/api/v1/chat/completions';
        headers['Authorization'] = `Bearer ${apiKey}`;
      }

      const res = await fetch(url, {
        method: 'POST',
        headers,
        body: JSON.stringify({ model, messages, temperature: 0.6 })
      });

      if (!res.ok) {
        const errData = await res.text();
        throw new Error(`HTTP ${res.status} - ${errData.slice(0, 120)}`);
      }
      const data = await res.json();
      return data.choices[0].message.content;
    }

    // Button & Form Handlers
    toggleLiveBtn.addEventListener('click', () => {
      if (!recognition) return;
      state.continuous = !state.continuous;
      toggleLiveBtn.classList.toggle('active', state.continuous);
      toggleLiveBtn.textContent = state.continuous ? 'DISENGAGE VOICE' : 'ENGAGE CONTINUOUS VOICE';
      if (state.continuous) {
        speechSynthesis.cancel();
        try { recognition.start(); } catch (_) {}
      } else {
        try { recognition.stop(); } catch (_) {}
        setMode('idle', 'SYSTEM IDLE // READY');
      }
    });

    document.getElementById('reactor').addEventListener('click', () => toggleLiveBtn.click());

    pttBtn.addEventListener('mousedown', () => {
      if (!recognition || state.continuous) return;
      speechSynthesis.cancel();
      try { recognition.start(); } catch (_) {}
    });
    pttBtn.addEventListener('mouseup', () => {
      if (!recognition || state.continuous) return;
      try { recognition.stop(); } catch (_) {}
    });

    stopSpeechBtn.addEventListener('click', () => {
      speechSynthesis.cancel();
      setMode('idle', 'AUDIO MUTED // READY');
    });

    textForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const val = textInput.value.trim();
      if (!val) return;
      textInput.value = '';
      handleUserMessage(val);
    });

    // Neural Reactor Canvas Animation
    const canvas = document.getElementById('reactor');
    const ctx = canvas.getContext('2d');
    let phase = 0;

    function drawReactor() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;
      const palette = {
        idle: '56, 189, 248',
        listening: '16, 185, 129',
        processing: '245, 158, 11',
        speaking: '125, 211, 252'
      };
      const rgb = palette[state.mode];
      const speed = state.mode === 'processing' ? 0.08 : state.mode === 'speaking' ? 0.06 : 0.02;
      const pulse = state.mode === 'speaking' ? Math.sin(phase * 3) * 10 : Math.sin(phase) * 4;
      phase += speed;

      // Outer segmented ring
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(phase * 0.4);
      ctx.strokeStyle = `rgba(${rgb}, 0.35)`;
      ctx.lineWidth = 2;
      ctx.setLineDash([28, 14, 6, 14]);
      ctx.beginPath();
      ctx.arc(0, 0, 115 + pulse * 0.3, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Counter-rotating inner ring
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(-phase * 0.7);
      ctx.strokeStyle = `rgba(${rgb}, 0.7)`;
      ctx.lineWidth = 3;
      ctx.setLineDash([45, 20]);
      ctx.beginPath();
      ctx.arc(0, 0, 82 + pulse * 0.5, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      // Core glow
      const grad = ctx.createRadialGradient(cx, cy, 8, cx, cy, 65 + pulse);
      grad.addColorStop(0, `rgba(${rgb}, 0.9)`);
      grad.addColorStop(0.5, `rgba(${rgb}, 0.25)`);
      grad.addColorStop(1, `rgba(${rgb}, 0)`);
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(cx, cy, 65 + pulse, 0, Math.PI * 2);
      ctx.fill();

      requestAnimationFrame(drawReactor);
    }
    drawReactor();
  </script>
</body>
</html>
