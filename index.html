<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ONYX // Personal Voice Assistant</title>
  <style>
    :root {
      --bg: #070b14;
      --card: #0f172a;
      --cyan: #38bdf8;
      --green: #10b981;
      --amber: #f59e0b;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body {
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 20px;
    }
    .top-bar {
      width: 100%;
      max-width: 600px;
      background: var(--card);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid rgba(56, 189, 248, 0.2);
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .top-bar input {
      flex: 1;
      background: #020617;
      border: 1px solid #1e293b;
      color: var(--text);
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 0.9rem;
      outline: none;
    }
    .top-bar input:focus { border-color: var(--cyan); }
    .badge {
      font-size: 0.75rem;
      font-weight: 700;
      padding: 6px 10px;
      border-radius: 6px;
      background: rgba(16, 185, 129, 0.15);
      color: var(--green);
      white-space: nowrap;
    }
    .center-hub {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      max-width: 540px;
      width: 100%;
      my: auto;
    }
    .orb {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(56,189,248,0.35) 0%, rgba(56,189,248,0.05) 70%);
      border: 2px solid var(--cyan);
      box-shadow: 0 0 35px rgba(56, 189, 248, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      letter-spacing: 0.2em;
      color: var(--cyan);
      cursor: pointer;
      transition: all 0.25s ease;
      user-select: none;
    }
    .orb.listening {
      border-color: var(--green);
      color: var(--green);
      background: radial-gradient(circle, rgba(16,185,129,0.4) 0%, rgba(16,185,129,0.05) 70%);
      box-shadow: 0 0 45px rgba(16, 185, 129, 0.45);
      transform: scale(1.06);
    }
    .orb.thinking {
      border-color: var(--amber);
      color: var(--amber);
      background: radial-gradient(circle, rgba(245,158,11,0.4) 0%, rgba(245,158,11,0.05) 70%);
      box-shadow: 0 0 45px rgba(245, 158, 11, 0.4);
    }
    .status {
      margin-top: 20px;
      font-size: 0.8rem;
      letter-spacing: 0.18em;
      color: var(--muted);
      text-transform: uppercase;
    }
    .caption {
      margin-top: 14px;
      font-size: 1.05rem;
      line-height: 1.55;
      min-height: 60px;
      color: var(--text);
    }
    .bottom-bar {
      width: 100%;
      max-width: 600px;
      display: flex;
      gap: 10px;
    }
    .bottom-bar input {
      flex: 1;
      background: var(--card);
      border: 1px solid #1e293b;
      color: var(--text);
      padding: 12px 16px;
      border-radius: 10px;
      font-size: 0.95rem;
      outline: none;
    }
    .bottom-bar button {
      background: var(--cyan);
      color: #020617;
      border: none;
      padding: 0 20px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <input id="apiKey" type="password" placeholder="Paste free Google AI Studio Key (AIza...)" />
    <span class="badge" id="keyStatus">NO KEY</span>
  </div>

  <div class="center-hub">
    <div class="orb" id="orbBtn">ONYX</div>
    <div class="status" id="statusText">TAP CIRCLE TO SPEAK</div>
    <div class="caption" id="captionText">Paste your free Google AI Studio key above, then tap the circle to talk.</div>
  </div>

  <form class="bottom-bar" id="chatForm">
    <input id="textInput" type="text" placeholder="Or type a message here..." autocomplete="off" />
    <button type="submit">SEND</button>
  </form>

  <script>
    const SYSTEM_PROMPT = `You are ONYX, a calm, intelligent, concise personal AI assistant inspired by J.A.R.V.I.S. Keep answers clear, direct, and natural to listen to—avoid markdown symbols, asterisks, or bullet formatting.`;

    const apiKeyInput = document.getElementById('apiKey');
    const keyStatus = document.getElementById('keyStatus');
    const orbBtn = document.getElementById('orbBtn');
    const statusText = document.getElementById('statusText');
    const captionText = document.getElementById('captionText');
    const chatForm = document.getElementById('chatForm');
    const textInput = document.getElementById('textInput');

    let isListening = false;
    const history = [{ role: 'system', content: SYSTEM_PROMPT }];

    // Load saved API key automatically
    const savedKey = localStorage.getItem('onyx_free_key') || '';
    if (savedKey) {
      apiKeyInput.value = savedKey;
      keyStatus.textContent = 'KEY SAVED';
    }

    apiKeyInput.addEventListener('input', () => {
      const val = apiKeyInput.value.trim();
      localStorage.setItem('onyx_free_key', val);
      keyStatus.textContent = val ? 'KEY SAVED' : 'NO KEY';
    });

    // Browser Speech Recognition
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    const recognition = SpeechRecognition ? new SpeechRecognition() : null;

    if (recognition) {
      recognition.lang = 'en-US';
      recognition.interimResults = true;

      recognition.onstart = () => {
        isListening = true;
        orbBtn.className = 'orb listening';
        statusText.textContent = 'LISTENING...';
      };

      recognition.onresult = (e) => {
        let transcript = '';
        let isFinal = false;
        for (let i = e.resultIndex; i < e.results.length; i++) {
          transcript += e.results[i][0].transcript;
          if (e.results[i].isFinal) isFinal = true;
        }
        captionText.textContent = transcript;
        if (isFinal && transcript.trim()) {
          sendMessage(transcript.trim());
        }
      };

      recognition.onend = () => {
        isListening = false;
        if (orbBtn.classList.contains('listening')) {
          orbBtn.className = 'orb';
          statusText.textContent = 'TAP CIRCLE TO SPEAK';
        }
      };
    }

    orbBtn.addEventListener('click', () => {
      speechSynthesis.cancel();
      if (!recognition) {
        captionText.textContent = 'Voice input requires Chrome or Edge. Use the text box below.';
        return;
      }
      if (isListening) {
        recognition.stop();
      } else {
        try { recognition.start(); } catch (_) {}
      }
    });

    function speak(reply) {
      speechSynthesis.cancel();
      const utterance = new SpeechSynthesisUtterance(reply.replace(/[*#_`]/g, ''));
      const voices = speechSynthesis.getVoices();
      const preferred = voices.find(v => v.name.includes('UK English Male') || v.name.includes('Daniel'));
      if (preferred) utterance.voice = preferred;
      utterance.onstart = () => { statusText.textContent = 'SPEAKING...'; };
      utterance.onend = () => { statusText.textContent = 'TAP CIRCLE TO SPEAK'; };
      speechSynthesis.speak(utterance);
    }

    async function sendMessage(text) {
      const apiKey = apiKeyInput.value.trim();
      if (!apiKey) {
        captionText.textContent = 'Please paste your free Google AI Studio API key in the top box first.';
        return;
      }

      orbBtn.className = 'orb thinking';
      statusText.textContent = 'THINKING...';
      captionText.textContent = text;
      history.push({ role: 'user', content: text });

      try {
        const res = await fetch('https://generativelanguage.googleapis.com/v1beta/openai/chat/completions', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${apiKey}`
          },
          body: JSON.stringify({
            model: 'gemini-3.5-flash-lite',
            messages: history
          })
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.error?.message || `Error ${res.status}`);

        const reply = data.choices[0].message.content;
        history.push({ role: 'assistant', content: reply });
        orbBtn.className = 'orb';
        captionText.textContent = reply;
        speak(reply);
      } catch (err) {
        orbBtn.className = 'orb';
        statusText.textContent = 'CONNECTION ERROR';
        captionText.textContent = err.message;
      }
    }

    chatForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const text = textInput.value.trim();
      if (!text) return;
      textInput.value = '';
      sendMessage(text);
    });
  </script>
</body>
</html>
